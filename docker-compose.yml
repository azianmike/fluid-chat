services:
  app:
    build: .
    command: sh -c "npm run db:migrate && npm run dev"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://fluidchat:fluidchat@postgres:5432/fluidchat
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: change-me-at-least-32-characters
      APP_URL: http://localhost:3000
      REALTIME_INTERNAL_URL: http://realtime:3001
      NEXT_PUBLIC_REALTIME_URL: http://localhost:3001
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: fluidchat
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  realtime:
    build: .
    command: npm run realtime
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://fluidchat:fluidchat@postgres:5432/fluidchat
      REDIS_URL: redis://redis:6379
      REALTIME_PORT: 3001
      APP_URL: http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: npm run worker
    environment:
      DATABASE_URL: postgres://fluidchat:fluidchat@postgres:5432/fluidchat
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: fluidchat
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fluidchat
      POSTGRES_PASSWORD: fluidchat
      POSTGRES_DB: fluidchat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluidchat"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      do sleep 1; done; /usr/bin/mc mb --ignore-existing local/fluidchat"

volumes:
  postgres_data:
  minio_data:
