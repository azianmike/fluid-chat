services:
  app:
    build: .
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://openchat:openchat@postgres:5432/openchat
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: change-me-at-least-32-characters
      APP_URL: http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis

  realtime:
    build: .
    command: npm run realtime
    ports:
      - "3001:3001"
    environment:
      REDIS_URL: redis://redis:6379
      REALTIME_PORT: 3001
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - redis

  worker:
    build: .
    command: npm run worker
    environment:
      DATABASE_URL: postgres://openchat:openchat@postgres:5432/openchat
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
    volumes:
      - .:/app
      - ./exports:/app/exports
      - /app/node_modules
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openchat
      POSTGRES_PASSWORD: openchat
      POSTGRES_DB: openchat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
